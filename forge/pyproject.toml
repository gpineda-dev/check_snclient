[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "check_snclient-forge"
version = "0.1.0"
description = "E2E Integration test harness for check_snclient"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest-testinfra>=10.2.0",
    "jinja2>=3.1.0",
    "ansible-core>=2.15.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
forge = "forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -s"
