---
- name: Synchronize binary slot
  hosts: all
  gather_facts: false
  tasks:
    - name: Deploy custom binary to container slot
      when: target_type == 'container'
      block:
        - name: Copy binary to container slot
          ansible.builtin.copy:
            src: "{{ binary_src }}"
            dest: "/usr/bin/{{ component }}.custom"
            mode: '0755'
        - name: Update active container symlink
          ansible.builtin.file:
            src: "/usr/bin/{{ component }}.custom"
            dest: "/usr/bin/{{ component }}"
            state: link
            force: true

    - name: Deploy symlink to host slot
      when: target_type == 'host'
      block:
        - name: Update active host symlink
          ansible.builtin.file:
            src: "{{ binary_src }}"
            dest: "{{ slot_dest }}"
            state: link
            force: true
